name: Build HPC Craft for Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Build game
        run: cargo build --release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: HPC-Craft-Windows
          path: target/release/*.exe
